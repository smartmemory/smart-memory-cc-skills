# Minimal CI, running on the self-hosted Forgejo runner at git.smartmemory.ai.
# GitHub Actions for this org is billing-blocked, so this stays red on GitHub by
# design -- the authoritative run is the Forgejo one.
name: smoke
on: [push]
# Read-only GITHUB_TOKEN: nothing in this CI job writes to the repo or publishes (ACTIONS-LOCKDOWN-1).
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Skills bundle sanity
        run: |
          count=$(find . -name '*.md' -not -path './.git/*' | wc -l)
          echo "markdown files: $count"
          test "$count" -gt 0
